name: Security and Betting Regressions

on:
  pull_request:
    branches: [integration, main]
    paths-ignore:
      # Workflow-only setup commits should not repeatedly test the
      # STILL-UNPATCHED main/integration lockfile. As soon as the patch
      # workflow commits package.json/package-lock.json, the PR test runs.
      - '.github/workflows/security-patch-sandbox.yml'
      - '.github/workflows/security-and-betting-regressions.yml'
      - '.github/dependabot.yml'
  push:
    branches: [integration, main]
  schedule:
    - cron: '18 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-betting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Dependencies, security, build, betting integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible install
        run: npm ci --no-fund --no-audit
      - name: Block HIGH/CRITICAL runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Existing full-repository ESLint baseline (report only)
        # Currently 24 errors / 24 warnings, inherited from integration.
        # Do not silently remove lint coverage or rewrite unrelated app code
        # as part of a dependency-only emergency security patch.
        continue-on-error: true
        run: npm run lint
      - name: Strict ESLint for changed TypeScript files (no NEW errors vs. base)
        shell: bash
        run: |
          # NOT "lint every changed file in full" — a touched file (e.g. app/admin/page.tsx)
          # can carry pre-existing baseline errors (see the full-repo step above) that have
          # nothing to do with this change; failing on those would make it impossible to ever
          # touch that file again for an unrelated reason. Instead: lint each changed file as
          # it stands now AND as it stood at $BASE (via `git show`, no working-tree mutation),
          # and fail only if THIS change raised that file's own error COUNT — i.e. a genuinely
          # new problem, not inherited debt. A newly added file has no $BASE version → 0.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE=FETCH_HEAD
          else
            BASE=HEAD^
          fi
          mapfile -d '' FILES < <(git diff --name-only -z "$BASE" HEAD -- '*.ts' '*.tsx')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo 'No changed TS/TSX files. Full lint baseline is reported above.'
            exit 0
          fi
          echo "Checking ${#FILES[@]} changed TS/TSX files for new lint errors introduced by this change"
          FAIL=0
          count_errors() {
            node -e "let d=[];try{d=JSON.parse(require('fs').readFileSync(0,'utf8'))}catch{};console.log(d.reduce((s,r)=>s+(r.errorCount||0),0))"
          }
          for f in "${FILES[@]}"; do
            [ -f "$f" ] || continue
            AFTER=$(npx eslint -f json -- "$f" 2>/dev/null | count_errors)
            BEFORE=0
            if git cat-file -e "$BASE:$f" 2>/dev/null; then
              BEFORE=$(git show "$BASE:$f" | npx eslint --stdin --stdin-filename "$f" -f json 2>/dev/null | count_errors)
            fi
            if [ "$AFTER" -gt "$BEFORE" ]; then
              echo "::error file=$f::New lint errors introduced ($BEFORE -> $AFTER). Run 'npx eslint $f' locally and fix what this change added."
              FAIL=1
            else
              echo "OK: $f ($BEFORE -> $AFTER errors, no increase)"
            fi
          done
          exit $FAIL
      - name: Verify annulment, cancellations and Risky accounting
        run: |
          node --experimental-strip-types scripts/run-match-annulment-check.mjs
          node --experimental-strip-types scripts/run-slip-lifecycle-check.mjs
          node --experimental-strip-types scripts/run-meine-wetten-check.mjs
          node --experimental-strip-types scripts/run-combo-leg-order-check.mjs
          node --experimental-strip-types scripts/run-betting-activity-stats-check.mjs
      - name: Verify production build without real secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-only-placeholder-key
          SUPABASE_SERVICE_ROLE_KEY: ci-only-placeholder-key
        run: npm run build
